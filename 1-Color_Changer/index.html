<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
</body>
<script>
    const button = document.querySelectorAll('div')
    console.log(button)
    button.forEach((button) => {
        console.log(button)
        button.addEventListener('click', (e) =>{
            if (e.target.className === 'box1') {
                document.body.style.background = 'aqua'
            }
            if (e.target.className === 'box2') {
                document.body.style.background = 'sandybrown'
            }
            if (e.target.className === 'box3') {
                document.body.style.background = 'rgb(233, 108, 108)'
            }
            if (e.target.className === 'box4') {
                document.body.style.background = 'pink'
            }
        })
    })
</script>
</html>
